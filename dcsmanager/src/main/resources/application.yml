server:
  port: ${SERVER_PORT:8080}
  # 2026-09-12 추가: 원래 세션 타임아웃을 지정하지 않아 Spring Boot 기본값인 30분이
  # 적용되고 있었음. memo-link 화면에서 메모를 30분 넘게 작성하다 "추가"를 누르면
  # 세션이 이미 끊겨 CSRF 검증에 실패(403)하고, 화면에는 뭉뚱그려 "저장실패"만 표시되는
  # 문제가 있었음 - 넉넉하게 늘려서 이 문제를 없앰.
  servlet:
    session:
      # 2026-09-14 수정: 8h로 늘렸는데도 memo-link(공통메모) 화면을 오래 띄워두면
      # (점심시간/야간 등) 여전히 세션이 끊겨 CSRF 검증 실패(403 Forbidden)가 발생한다는
      # 보고가 있어 아예 무제한(-1 = 비활성 타임아웃 없음)으로 변경.
      # 단, 서버 재시작/배포 시에는 메모리에 있던 세션 자체가 사라지므로 그 경우엔
      # 여전히 한 번은 새로고침이 필요함 - 타임아웃을 늘리는 것만으로는 100% 방지 불가.
      # timeout: 8h
      timeout: -1

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:dcs}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:dcs}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  thymeleaf:
    cache: false

dcsserver:
  base-url: ${DCSSERVER_URL:https://dcsserver:8444}
  api-key: ${DCSSERVER_API_KEY:changeme}
  poll-interval-ms: ${DCSSERVER_POLL_INTERVAL_MS:3000}

eaiserver:
  http-port: ${EAI_SERVER_HTTP_PORT:8445}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  token-file: ${KAKAO_TOKEN_FILE:/data001/kakao/refresh_token.txt}

logging:
  level:
    com.dcsmanager: DEBUG
