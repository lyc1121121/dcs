<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DCSManager - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container login-container">
    <h1>DCSManager 로그인</h1>
    <div th:if="${param.error}" class="alert alert-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div th:if="${param.logout}" class="alert alert-success">로그아웃 되었습니다.</div>
    <form th:action="@{/login}" method="post" class="dcs-form">
        <div class="form-row">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autofocus="autofocus"/>
        </div>
        <div class="form-row">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password"/>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">로그인</button>
        </div>
    </form>
</div>
</body>
</html>
