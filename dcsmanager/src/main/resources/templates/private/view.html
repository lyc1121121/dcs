<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="'TMSManager - ' + ${pageTitle}">TMSManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-content-body { line-height: 1.7; }
        .page-content-body h1 { font-size: 26px; margin: 0 0 16px; }
        .page-content-body h2 { font-size: 20px; margin: 32px 0 12px; border-bottom: 2px solid #e0e0e0; padding-bottom: 6px; }
        .page-content-body h3 { font-size: 16px; margin: 20px 0 8px; }
        .page-content-body p { margin: 8px 0; }
        .page-content-body ul, .page-content-body ol { padding-left: 22px; }
        .page-content-body li { margin: 4px 0; }
        .page-content-body img { max-width: 100%; border-radius: 8px; margin: 12px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
        .page-content-body code { background: #f0f2f5; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
        .page-content-body pre { background: #1f2937; color: #e5e7eb; padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
        .page-content-body pre code { background: none; padding: 0; color: inherit; }
        .page-content-body table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        .page-content-body th, .page-content-body td { border: 1px solid #e0e0e0; padding: 8px 10px; text-align: left; font-size: 14px; }
        .page-content-body th { background: #fafafa; }
        .page-content-body hr { border: none; border-top: 1px solid #e0e0e0; margin: 28px 0; }
        .page-content-edit textarea {
            width: 100%; min-height: 60vh; font-family: "D2Coding", "Consolas", monospace;
            font-size: 13px; padding: 14px; border: 1px solid #ccc; border-radius: 6px; resize: vertical;
        }
        .page-content-toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 16px; }
        .nav-badge.tab-toggle { cursor: pointer; border: none; font: inherit; }
        .nav-badge.tab-toggle.active { outline: 2px solid #2f6fed; outline-offset: -2px; }

        /* ---- 158단계: 파일탐색기 ---- */
        .fb-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .fb-path { font-family: "D2Coding", "Consolas", monospace; font-size: 13px; color: #555; word-break: break-all; }
        .fb-crumb { cursor: pointer; color: #2f6fed; }
        .fb-crumb:hover { text-decoration: underline; }
        .fb-layout { display: flex; gap: 16px; align-items: flex-start; }
        .fb-list { flex: 0 0 380px; border: 1px solid #e0e0e0; border-radius: 6px; max-height: 65vh; overflow-y: auto; }
        .fb-list table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .fb-list th { position: sticky; top: 0; background: #fafafa; text-align: left; padding: 6px 8px; border-bottom: 1px solid #e0e0e0; }
        .fb-list td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; cursor: pointer; white-space: nowrap; }
        .fb-list tr:hover td { background: #eef2fb; }
        .fb-list .fb-name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
        .fb-list .fb-size { color: #888; text-align: right; }
        .fb-viewer { flex: 1; min-width: 0; border: 1px solid #e0e0e0; border-radius: 6px; padding: 14px; min-height: 65vh; max-height: 65vh; overflow: auto; }
        .fb-viewer pre { background: #1f2937; color: #e5e7eb; padding: 14px; border-radius: 6px; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
        .fb-viewer img { max-width: 100%; border-radius: 6px; }
        .fb-pdf-frame { width: 100%; height: 60vh; border: 1px solid #e0e0e0; border-radius: 6px; }
        .fb-empty { color: #999; text-align: center; padding: 60px 0; }
        .fb-file-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .fb-file-header .btn { text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <header class="page-header">
        <div class="title-row">
            <a th:href="@{${backUrl}}" class="nav-badge">
                <span class="nav-badge-icon">⬅️</span>TMSManager로
            </a>
            <h1 class="nav-badge nav-badge-title">
                <span class="nav-badge-icon">📋</span><span th:text="${pageTitle}">PRIVATE</span>
            </h1>
            <button type="button" id="tabBtnNote" class="nav-badge tab-toggle active" onclick="showPanel('note')">
                <span class="nav-badge-icon">📝</span>private내역
            </button>
            <button type="button" id="tabBtnFiles" class="nav-badge tab-toggle" onclick="showPanel('files')">
                <span class="nav-badge-icon">🗂️</span>파일탐색기
            </button>
            <a th:if="${logoutUrl}" th:href="@{${logoutUrl}}" class="nav-badge nav-badge-jobradar">
                <span class="nav-badge-icon">🚪</span>로그아웃
            </a>
        </div>
    </header>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <section class="section-card" id="panelNote">
        <div class="page-content-toolbar">
            <button type="button" id="btn-view-mode" class="btn btn-primary btn-sm" onclick="showMode('view')">보기</button>
            <button type="button" id="btn-edit-mode" class="btn btn-sm" onclick="showMode('edit')">수정</button>
        </div>

        <div id="page-content-view" class="page-content-body" th:utext="${contentHtml}"></div>

        <form id="page-content-edit" class="page-content-edit" method="post" th:action="@{${formAction}}" style="display:none;">
            <textarea name="contentMarkdown" th:text="${contentMarkdown}"></textarea>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">저장</button>
                <button type="button" class="btn" onclick="showMode('view')">취소</button>
            </div>
        </form>
    </section>

    <section class="section-card" id="panelFiles" style="display:none;">
        <div class="fb-toolbar">
            <button type="button" class="btn btn-sm" onclick="fbUp()">⬆ 상위로</button>
            <button type="button" class="btn btn-sm" onclick="fbReload()">새로고침</button>
            <span class="fb-path" id="fbPath"></span>
        </div>
        <p class="hint">실제 서버(CentOS)의 /working 폴더를 읽기전용으로 보여줍니다. 폴더를 클릭하면 이동, 파일을 클릭하면 오른쪽에 내용이 표시됩니다.</p>
        <div class="fb-layout">
            <div class="fb-list">
                <table>
                    <thead><tr><th>이름</th><th>크기</th><th>수정일</th></tr></thead>
                    <tbody id="fbListBody"><tr><td colspan="3" class="empty">불러오는 중...</td></tr></tbody>
                </table>
            </div>
            <div class="fb-viewer" id="fbViewer"><div class="fb-empty">왼쪽에서 파일을 선택하세요.</div></div>
        </div>
    </section>
</div>
<script>
    function showMode(mode) {
        var isEdit = mode === 'edit';
        document.getElementById('page-content-view').style.display = isEdit ? 'none' : '';
        document.getElementById('page-content-edit').style.display = isEdit ? '' : 'none';
        document.getElementById('btn-view-mode').classList.toggle('btn-primary', !isEdit);
        document.getElementById('btn-edit-mode').classList.toggle('btn-primary', isEdit);
    }

    function showPanel(panel) {
        var isFiles = panel === 'files';
        document.getElementById('panelNote').style.display = isFiles ? 'none' : '';
        document.getElementById('panelFiles').style.display = isFiles ? '' : 'none';
        document.getElementById('tabBtnNote').classList.toggle('active', !isFiles);
        document.getElementById('tabBtnFiles').classList.toggle('active', isFiles);
        if (isFiles && !fbLoadedOnce) {
            fbLoadedOnce = true;
            fbLoad('');
        }
    }

    // ---- 158단계: 파일탐색기 ----
    var fbLoadedOnce = false;
    var fbCurrentPath = '';

    function fbEscapeHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fbFormatSize(bytes) {
        if (bytes === null || bytes === undefined) { return ''; }
        if (bytes < 1024) { return bytes + ' B'; }
        if (bytes < 1024 * 1024) { return (bytes / 1024).toFixed(1) + ' KB'; }
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function fbRenderPath(path) {
        var el = document.getElementById('fbPath');
        var parts = path ? path.split('/') : [];
        var html = '<span class="fb-crumb" onclick="fbLoad(\'\')">/working</span>';
        var acc = '';
        parts.forEach(function (p) {
            acc = acc ? (acc + '/' + p) : p;
            html += ' / <span class="fb-crumb" onclick="fbLoad(\'' + fbEscapeHtml(acc).replace(/'/g, "\\'") + '\')">' + fbEscapeHtml(p) + '</span>';
        });
        el.innerHTML = html;
    }

    function fbLoad(path) {
        fetch('/private/files?path=' + encodeURIComponent(path))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!data.ok) {
                    document.getElementById('fbListBody').innerHTML = '<tr><td colspan="3" class="empty">' + fbEscapeHtml(data.message || '조회 실패') + '</td></tr>';
                    return;
                }
                fbCurrentPath = data.path || '';
                fbRenderPath(fbCurrentPath);
                var body = document.getElementById('fbListBody');
                if (data.entries.length === 0) {
                    body.innerHTML = '<tr><td colspan="3" class="empty">비어있는 폴더입니다.</td></tr>';
                    return;
                }
                body.innerHTML = data.entries.map(function (e) {
                    var icon = e.dir ? '📁' : '📄';
                    var full = fbCurrentPath ? (fbCurrentPath + '/' + e.name) : e.name;
                    var action = e.dir
                        ? "fbLoad('" + fbEscapeHtml(full).replace(/'/g, "\\'") + "')"
                        : "fbOpenFile('" + fbEscapeHtml(full).replace(/'/g, "\\'") + "')";
                    return '<tr onclick="' + action + '">' +
                        '<td class="fb-name">' + icon + ' ' + fbEscapeHtml(e.name) + '</td>' +
                        '<td class="fb-size">' + (e.dir ? '' : fbFormatSize(e.size)) + '</td>' +
                        '<td>' + fbEscapeHtml(e.modified || '') + '</td>' +
                        '</tr>';
                }).join('');
            })
            .catch(function () {
                document.getElementById('fbListBody').innerHTML = '<tr><td colspan="3" class="empty">조회 실패(네트워크 오류)</td></tr>';
            });
    }

    function fbUp() {
        if (!fbCurrentPath) { return; }
        var idx = fbCurrentPath.lastIndexOf('/');
        fbLoad(idx === -1 ? '' : fbCurrentPath.substring(0, idx));
    }

    function fbReload() {
        fbLoad(fbCurrentPath);
    }

    function fbOpenFile(path) {
        var viewer = document.getElementById('fbViewer');
        viewer.innerHTML = '<div class="fb-empty">불러오는 중...</div>';
        fetch('/private/files/content?path=' + encodeURIComponent(path))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!data.ok) {
                    viewer.innerHTML = '<div class="fb-empty">' + fbEscapeHtml(data.message || '조회 실패') + '</div>';
                    return;
                }
                var header = '<div class="fb-file-header" style="margin-bottom:8px">' +
                    '<span class="hint">' + fbEscapeHtml(data.name) + ' (' + fbFormatSize(data.size) + ')</span>' +
                    '<a class="btn btn-sm" href="/private/files/download?path=' + encodeURIComponent(path) + '" download>⬇ 다운로드</a>' +
                    '<button type="button" class="btn btn-sm" onclick="fbKakaoSend(\'' + fbEscapeHtml(path).replace(/'/g, "\\'") + '\')">📩 카카오톡으로 보내기</button>' +
                    '<span id="fbKakaoStatus" class="hint"></span>' +
                    '</div>';
                if (data.type === 'image') {
                    viewer.innerHTML = header + '<img src="' + data.imageUrl + '" alt="' + fbEscapeHtml(data.name) + '">';
                } else if (data.type === 'pdf') {
                    viewer.innerHTML = header + '<iframe src="' + data.pdfUrl + '" class="fb-pdf-frame"></iframe>';
                } else if (data.type === 'office') {
                    viewer.innerHTML = header +
                        '<p class="hint">※ 서식·이미지 없이 텍스트 내용만 추출한 미리보기입니다.</p>' +
                        '<pre>' + fbEscapeHtml(data.text) + '</pre>';
                } else if (data.type === 'text') {
                    var trunc = data.truncated ? '<p class="hint">※ 파일이 커서 앞부분(10MB)만 표시합니다.</p>' : '';
                    viewer.innerHTML = header + trunc + '<pre>' + fbEscapeHtml(data.text) + '</pre>';
                } else {
                    viewer.innerHTML = header + '<div class="fb-empty">미리보기를 지원하지 않는 파일 형식입니다.</div>';
                }
            })
            .catch(function () {
                viewer.innerHTML = '<div class="fb-empty">조회 실패(네트워크 오류)</div>';
            });
    }

    function fbKakaoSend(path) {
        var status = document.getElementById('fbKakaoStatus');
        if (status) { status.textContent = '전송 중...'; }
        var csrfToken = document.querySelector('meta[name="_csrf"]').content;
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        var headers = {};
        headers[csrfHeader] = csrfToken;
        fetch('/private/files/kakao-send?path=' + encodeURIComponent(path), { method: 'POST', headers: headers })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!status) { return; }
                status.textContent = data.ok ? '✅ 카카오톡으로 전송했습니다 (60분간 유효)' : '❌ 전송 실패: ' + (data.message || '');
            })
            .catch(function () {
                if (status) { status.textContent = '❌ 전송 실패(네트워크 오류)'; }
            });
    }
</script>
</body>
</html>
